<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PackList</title>

<!-- viewport-fit=cover lets the app paint under the notch; the app already
     pads for env(safe-area-inset-bottom). -->
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />

<meta name="description" content="Everything you own, tracked across every move." />
<meta name="theme-color" content="#0E0E10" />

<!-- iOS standalone: no Safari chrome once added to the home screen. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PackList" />
<link rel="apple-touch-icon" href="./icon-180.png" />

<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon-192.png" />

<style>
  html, body { margin: 0; padding: 0; background: #D6D6DA; }
  html, body { overscroll-behavior: none; }
  /* Standalone mode has no browser chrome, so the app owns the full height. */
  #root { min-height: 100dvh; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="./bundle.js"></script>
</body>
</html>
